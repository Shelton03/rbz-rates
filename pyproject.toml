[project]
name = "rbz-rates"
version = "0.1.0"
description = "Unofficial open API for Reserve Bank of Zimbabwe daily interbank exchange rates"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "pdfplumber>=0.11"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "reportlab>=4", "fastapi>=0.110", "httpx>=0.27"]

[tool.setuptools]
packages = ["rbz_rates"]
