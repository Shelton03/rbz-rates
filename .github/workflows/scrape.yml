name: scrape
on:
  schedule:
    # every hour 08:17-17:17 Harare time (UTC+2), Mon-Fri
    - cron: "17 6-15 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - id: run
        run: python -m rbz_rates.pipeline update
        continue-on-error: true
      - name: Commit new data
        id: commit
        run: |
          git config user.name "rbz-rates bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail loudly if a PDF could not be parsed
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Parse failure, see data/failures/. RBZ may have changed the layout."
          exit 1
  deploy:
    needs: scrape
    if: ${{ !cancelled() && needs.scrape.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" && pytest -q
