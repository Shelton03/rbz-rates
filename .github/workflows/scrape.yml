name: scrape
on:
  schedule:
    # every hour 08:17-17:17 Harare time (UTC+2), Mon-Fri
    - cron: "17 6-15 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # alerts about new sheet formats are opened as issues (GitHub emails the owner)
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - id: run
        run: python -m rbz_rates.pipeline update
        continue-on-error: true
        env:
          RBZ_ALERTS_FILE: ${{ runner.temp }}/alerts.jsonl
      - name: Open an issue for each new format, currency or parse failure (emails the owner)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS: ${{ runner.temp }}/alerts.jsonl
          OWNER: ${{ github.repository_owner }}
        run: |
          [ -s "$ALERTS" ] || { echo "no alerts"; exit 0; }
          gh label create rbz-alert --color d93f0b --description "Automatic alert from the scraper" 2>/dev/null || true
          open=$(gh issue list --label rbz-alert --state open --limit 200 --json title --jq '.[].title')
          while IFS= read -r line; do
            id=$(jq -r .id <<<"$line")
            if grep -qF "[$id]" <<<"$open"; then echo "already open: $id"; continue; fi
            { jq -r .body <<<"$line"; printf '\n\ncc @%s\n' "$OWNER"; } > "$RUNNER_TEMP/body.md"
            gh issue create --title "$(jq -r .title <<<"$line") [$id]" --label rbz-alert --body-file "$RUNNER_TEMP/body.md"
          done < "$ALERTS"
      - name: Commit new data
        id: commit
        run: |
          git config user.name "rbz-rates bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail loudly if a PDF could not be parsed
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Parse failure, see data/failures/. RBZ may have changed the layout."
          exit 1
  deploy:
    needs: scrape
    if: ${{ !cancelled() && needs.scrape.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" && pytest -q
